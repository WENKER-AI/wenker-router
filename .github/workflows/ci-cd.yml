name: CI/CD Pipeline - Tuần 2

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npx mocha tests/**/*.test.js --timeout 10000

  build:
    name: Build TypeScript
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript with esbuild
        run: npx ts-node scripts/build.ts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wenker-router-build
          path: ./dist/

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wenker-router-build
          path: ./dist/

      - name: Create version tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $VERSION"
          git tag v$VERSION
          git push origin v$VERSION

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.ref_name }}
          name: WENKER Router v${{ github.ref_name }}
          body: |
            Automated release created by GitHub Actions
            
            **Changes:**
            - TypeScript support added
            - Rate Limiting middleware
            - Google Analytics tracking
            - Lazy Loading for performance
            - Service Worker for offline support
            - Dark Mode support
            
            **Assets:**
            - Built files in `/dist`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: wenkerai/wenker-router:latest,wenkerai/wenker-router:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          npm audit --production
          npm audit fix --force
          git diff --quiet || (git config --global user.name "github-actions" && git config --global user.email "actions@github.com" && git commit -am "chore: apply security fixes" && git push)
