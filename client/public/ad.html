<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WENKER Sponsors</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      background: #020617;
      overflow: hidden;
    }
    .glow { position: fixed; inset: 0; pointer-events: none; }
    .glow::before, .glow::after {
      content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; filter: blur(90px); opacity: .25;
    }
    .glow::before { background: #06b6d4; top: -140px; left: -80px; }
    .glow::after { background: #7c3aed; bottom: -150px; right: -90px; }
    .card {
      position: relative;
      width: min(92vw, 560px);
      padding: 34px 30px;
      border-radius: 20px;
      background: rgba(15, 23, 42, .85);
      border: 1px solid rgba(51, 65, 85, .9);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .8);
      text-align: center;
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #67e8f9;
      border: 1px solid rgba(34, 211, 238, .35);
      background: rgba(34, 211, 238, .1);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    #logo { font-size: 46px; margin-bottom: 10px; }
    #sponsor { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 10px; }
    #pitch { font-size: 14px; line-height: 1.6; color: #94a3b8; margin-bottom: 22px; }
    .bar { height: 8px; border-radius: 999px; background: rgba(30, 41, 59, .9); overflow: hidden; }
    #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22d3ee, #6366f1); transition: width .25s linear; }
    #count { margin-top: 12px; font-size: 12px; color: #64748b; font-family: ui-monospace, monospace; }
    #done { margin-top: 18px; font-size: 13px; color: #34d399; font-weight: 700; display: none; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <span class="tag">Tai tro / Sponsored</span>
    <div id="logo">🚀</div>
    <div id="sponsor">Loading...</div>
    <p id="pitch"></p>
    <div class="bar"><div id="fill"></div></div>
    <div id="count">Chuan bi noi dung...</div>
    <div id="done">Cam on! Da nhan them luot chat.</div>
  </div>

  <script>
    // A small rotating set of "sponsored" creatives. These are placeholders shown
    // inside WENKER itself - no third-party tracker, no external network call.
    var SPONSORS = [
      { logo: "🚀", name: "NovaHost VPS", pitch: "May chu toc do cho developer Viet. The gia tri SSD, khoi dong 30 giay, ho tro 24/7." },
      { logo: "🧠", name: "PromptLab", pitch: "Thu nghiem va version-control prompt cho doi engineering cua ban. Mien phi 14 ngay." },
      { logo: "⚡", name: "EdgeDeploy", pitch: "Deploy app len 300+ edge node chi voi mot lenh. Khong cau hinh, khong surprise bill." },
      { logo: "🛰️", name: "TokenWatch", pitch: "Theo doi chi phi API cua 40+ nha cung cap LLM theo thoi gian thuc." },
      { logo: "🐍", name: "PyCI Cloud", pitch: "CI/CD Python toc do cao, moi lan build chi mat 12 giay." },
      { logo: "🎧", name: "DevCast FM", pitch: "Podcast ky thuat hang tuan ve AI, he phan tan va language mo hinh." },
      { logo: "🗂️", name: "VectorStore", pitch: "Namespace vector database cho team. San cho 1 ty embedding." },
      { logo: "🔒", name: "KeyGuard", pitch: "Quan ly API key va secret cho moi moi truong, co kiem soat truy cap." },
      { logo: "📊", name: "LatencyLens", pitch: "Rum speed monitoring cho he thong LLM streaming. Phat hien slow request." }
    ];

    var DURATION_MS = 6000;

    var pick = SPONSORS[Math.floor(Math.random() * SPONSORS.length)];
    document.getElementById("logo").textContent = pick.logo;
    document.getElementById("sponsor").textContent = pick.name;
    document.getElementById("pitch").textContent = pick.pitch;
    document.title = pick.name + " • WENKER Sponsors";

    var fill = document.getElementById("fill");
    var count = document.getElementById("count");
    var done = document.getElementById("done");
    var start = Date.now();
    var finished = false;

    function notify() {
      if (finished) return;
      finished = true;
      done.style.display = "block";
      count.textContent = "Hoan tat.";
      try {
        if (window.opener) {
          window.opener.postMessage({ type: "wenker-ad-done" }, "*");
        }
      } catch (e) { /* ignore */ }
      setTimeout(function () { window.close(); }, 900);
    }

    var timer = setInterval(function () {
      var pct = Math.min(100, ((Date.now() - start) / DURATION_MS) * 100);
      fill.style.width = pct + "%";
      var left = Math.max(0, Math.ceil((DURATION_MS - (Date.now() - start)) / 1000));
      count.textContent = " Quang cao ket thuc sau " + left + "s";
      if (pct >= 100) {
        clearInterval(timer);
        notify();
      }
    }, 120);

    // If the user comes back to the app tab before the timer ends, still credit them:
    // the ad was opened and viewed. The app also detects the tab closing.
    window.addEventListener("focus", function () {
      if (Date.now() - start > 1200) notify();
    });
    window.addEventListener("pagehide", notify);
  </script>
</body>
</html>
